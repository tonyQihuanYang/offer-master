# Real Kafka + real Flink, so you can see the Flink UI at http://localhost:8081
#
#   docker compose up --build        (first run pulls ~1GB of images)
#   open http://localhost:8081       (the Flink Web UI)
#   docker compose down -v           (stop & clean up)

services:
  # ── Kafka (KRaft mode — single node, no ZooKeeper) ───────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: fkd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ── Flink JobManager (the brain + the Web UI on :8081) ───────────────────
  jobmanager:
    build: .
    container_name: fkd-jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./sql:/opt/sql
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.backend: hashmap
        execution.checkpointing.interval: 10s

  # ── Flink TaskManager (the worker; 4 task slots) ─────────────────────────
  taskmanager:
    build: .
    container_name: fkd-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        execution.checkpointing.interval: 10s

  # ── Submits the SQL job to the cluster, then idles ───────────────────────
  sql-submitter:
    build: .
    container_name: fkd-sql-submitter
    depends_on:
      - jobmanager
      - taskmanager
      - kafka
    volumes:
      - ./sql:/opt/sql
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat > /opt/flink/conf/flink-conf.yaml <<'EOF'
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.port: 8081
        EOF
        echo "waiting for cluster & kafka..."; sleep 30
        /opt/flink/bin/sql-client.sh -f /opt/sql/fraud.sql
        echo "=== SQL submitted. Jobs now run in the cluster — see http://localhost:8081 ==="
        tail -f /dev/null

  # ── Producer: streams courier events into Kafka continuously ─────────────
  producer:
    build: ./producer
    container_name: fkd-producer
    depends_on:
      - kafka
    restart: on-failure
